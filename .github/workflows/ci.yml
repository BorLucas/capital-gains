name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Compiles and runs every test inside the Dockerfile's build stage
      - run: docker build -t capital-gains .
      - name: Smoke test (CLI mode)
        run: docker run -i --rm -m 256m capital-gains --spring.profiles.active=cli < examples/input.txt

spring.application.name=capital-gains
server.port=8080

# Keeps tax as 0.00 (not 0E-2 or scientific notation) in the JSON response
spring.jackson.serialization.write-bigdecimal-as-plain=true

# In-memory H2 database (wiped on every restart)
spring.datasource.url=jdbc:h2:mem:capitalgains;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console at /h2-console (JDBC URL: jdbc:h2:mem:capitalgains)
spring.h2.console.enabled=true

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Async order queue: how often the worker drains it, and how many orders per tick
orders.poll-interval-ms=200
orders.batch-size=10

spring.application.name=ganho-de-capital
server.port=8080

# Mantem o imposto como 0.00 (e nao 0E-2 ou notacao cientifica) no JSON de resposta
spring.jackson.serialization.write-bigdecimal-as-plain=true

# Banco em memoria H2 (zera a cada restart)
spring.datasource.url=jdbc:h2:mem:ganhodecapital;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console web do H2 em /h2-console (JDBC URL: jdbc:h2:mem:ganhodecapital)
spring.h2.console.enabled=true

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
